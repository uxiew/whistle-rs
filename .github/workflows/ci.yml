# The gates every pull request and every push to main has to pass.
#
# The expensive half of the differential — both proxies, every corpus, the
# long-connection benches — is not here; it is differential.yml, run by hand and
# weekly. What runs here takes minutes: Rust, the console, the docs' links, and
# the rules oracle, which asks upstream's own resolver the same 19,000
# questions without opening a port.
#
# Actions are pinned to the commit a release tag named when this was written;
# the tag is in the trailing comment. A tag can be moved, a commit cannot.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned 1.98.1 with
      # clippy and rustfmt. Printed, so a log says which compiler judged it.
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version && cargo clippy --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  msrv:
    name: Rust — the oldest supported version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read from Cargo.toml rather than written twice.
      - name: Install the rust-version toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      - run: cargo +"$MSRV" test --locked --all-targets
      - run: cargo +"$MSRV" test --locked --doc

  proxy-only:
    name: Proxy-only build — no Node, no console build
    runs-on: ubuntu-24.04
    # An image with Rust and no Node at all, so "builds without Node" is
    # measured rather than assumed. The tag matches rust-toolchain.toml.
    container: rust:1.98.1-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: There is no Node and no console build here
        run: |
          if command -v node; then echo "node is installed in this image"; exit 1; fi
          test ! -e ui-src/dist
      - run: cargo build --locked
      - name: The binary runs and serves the placeholder console
        run: scripts/check-console.sh target/debug/whistle-rs placeholder

  console:
    name: Console — Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor ui-src/package.json declares, and the current LTS.
        node: ['20.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix ui-src
      - run: npm run typecheck --prefix ui-src
      - run: npm run build --prefix ui-src

  # D1: a release binary with the real console for each platform, used there
  # the way a person uses it (scripts/smoke.mjs: HTTP, intercepted HTTPS, WS,
  # rules, values, a Node plugin, restart on the same data, stop), then
  # packaged with its license texts and checksums. The runners are GitHub's
  # virtual machines, not physical ones.
  platforms:
    name: ${{ matrix.name }} — release build, smoke test, package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Its tests already ran in the `rust` job (debug), so not again here.
          - { name: Linux x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, test: false }
          - { name: Linux arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { name: macOS arm64, os: macos-15, target: aarch64-apple-darwin, test: true }
          - { name: macOS x86_64, os: macos-15-intel, target: x86_64-apple-darwin, test: true }
          - { name: Windows x86_64, os: windows-2025, target: x86_64-pc-windows-msvc, test: true }
    defaults:
      run:
        # Git Bash on Windows, so one script serves all five.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not every runner image comes with rustup; with it, rust-toolchain.toml
      # picks the compiler.
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain && cargo --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # The order a fresh checkout needs: the console first, because build.rs
      # embeds whatever ui-src/dist holds when Rust compiles.
      - run: npm ci --prefix ui-src
      - run: npm run build --prefix ui-src
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: platform-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}
      - id: build
        run: cargo build --locked --release
      # --release, to reuse the dependencies just built rather than compile
      # everything a second time for the debug profile.
      # --no-fail-fast: cargo otherwise stops at the first test binary that
      # fails, and on a new platform every failure is worth seeing at once.
      - name: Tests on this platform
        if: matrix.test
        run: cargo test --locked --release --all-targets --no-fail-fast
      # This and the smoke test run even when a test failed, so one run shows
      # both; packaging below still needs every step to have passed.
      - name: Where the binary is, and what it needs from the system
        id: info
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          exe=target/release/whistle-rs
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          echo "EXE=$exe" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Linux)
              # The newest glibc symbol version it links: the oldest glibc it runs on.
              need=$(objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
              needs="glibc ${need#GLIBC_} or later" ;;
            macOS)
              need=$(otool -l "$exe" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
              needs="macOS $need or later" ;;
            Windows)
              # .cargo/config.toml links the C runtime in; the DLL's name left
              # in the binary would mean it did not take.
              if grep -qai 'vcruntime140' "$exe"; then
                echo "the binary still imports VCRUNTIME140.dll"; exit 1
              fi
              needs="Windows 10 or later; no Visual C++ Redistributable" ;;
          esac
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          echo "SUM=$sum" >> "$GITHUB_ENV"
          {
            echo "whistle-rs: $("$exe" --version)"
            echo "target: ${{ matrix.target }}"
            echo "commit: $GITHUB_SHA"
            echo "built by: $(rustc --version) on $ImageOS $ImageVersion"
            echo "runs on: $needs"
            # Which build of ui-src the binary embeds.
            echo "console: ui-src/dist/index.html sha256 $($sum ui-src/dist/index.html | cut -d' ' -f1)"
          } | tee BUILD-INFO.txt
      - name: Smoke test — use it as a person would
        if: ${{ !cancelled() && steps.info.outcome == 'success' }}
        run: node scripts/smoke.mjs "$EXE" --console built --json smoke-${{ matrix.target }}.json
      # The binary travels with its terms: our LICENSE, where things come from
      # (NOTICE.md), and the license texts of every crate and npm package
      # built into it, generated from the lockfiles for this target.
      - name: Package with license texts and checksums
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          name="whistle-rs-$version-${{ matrix.target }}"
          mkdir -p "dist-ci/$name"
          cp "$EXE" LICENSE NOTICE.md BUILD-INFO.txt "dist-ci/$name/"
          node scripts/third-party-licenses.mjs --target ${{ matrix.target }} --out "dist-ci/$name/THIRD-PARTY-LICENSES.md"
          # `sha256sum -c SHA256SUMS` inside the unpacked directory checks every file.
          (cd "dist-ci/$name" && $SUM "$(basename "$EXE")" LICENSE NOTICE.md BUILD-INFO.txt THIRD-PARTY-LICENSES.md > SHA256SUMS)
          cd dist-ci
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bso0 "$name.zip" "$name"
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          $SUM "$archive" > "$archive.sha256"
          mv "../smoke-${{ matrix.target }}.json" .
          rm -rf "$name"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whistle-rs-${{ matrix.target }}
          path: dist-ci/
          retention-days: 14
          if-no-files-found: error

  docs:
    name: Docs — relative links and anchors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/check-links.mjs

  differential:
    name: Differential — rules oracle and QR encoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The oracle is whistle running on this Node, and some of its answers
      # depend on the Node release (cases-compose.js records one). 26 is what
      # the declared differences were measured on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # whistle 2.10.8 and its whole tree, exactly as tests/differential's lockfile says.
      - run: npm ci --prefix tests/differential
      - run: cargo build --locked
      - run: node tests/differential/run.js fast --out target/differential/fast
      # The versions, binary hash, corpus hashes and every step's output, pass or fail.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: differential-fast
          path: target/differential/fast/
          retention-days: 30
