# The whole differential: real whistle and whix side by side, every
# hand-written corpus, the HTTPS/frames/timing/write/ws/dns/auth benches, the
# benches that start one proxy per mode, and upstream's own suite — run twice,
# against the baseline whistle 2.10.8 and against 2.10.10, with one whix
# binary. About eighteen minutes each on a laptop, so not on every pull request
# (ci.yml runs the fast half there): by hand, and weekly, so a regression is at
# most a week old when it is found.
#
# Each run is a gate on its own. matrix.js then compares the two case by case
# and says what moved between the releases; that is information, not a verdict.
#
# Everything it saw is uploaded, pass or fail: each manifest (commit, binary
# hash, whistle version, lockfile and corpus hashes), each step's output, each
# proxy's log, and the comparison.

name: Differential

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  network:
    name: Differential — every corpus and bench, against 2.10.8 and 2.10.10
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 26: the Node the declared differences were measured on; see ci.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: npm ci --prefix tests/differential
      # The second release, from a lockfile of its own — see
      # tests/differential/README.md, "到底对照的是哪个 whistle".
      - run: npm ci --prefix tests/differential/versions/2.10.10
      - run: cargo build --locked
      # Both runs, then the comparison, whatever the first one said: a release
      # that fails its gate is exactly when the comparison is wanted.
      - name: Differential against both releases
        run: |
          # `target/` comes from the cache, and an archive directory left in it
          # would have this run's logs appended to an older run's.
          rm -rf target/differential
          status=0
          node tests/differential/run.js all --out target/differential/all || status=1
          node tests/differential/run.js all --whistle 2.10.10 --out target/differential/all-2.10.10 || status=1
          node tests/differential/matrix.js target/differential/all target/differential/all-2.10.10 \
            --json target/differential/matrix.json || status=1
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: differential-all
          path: target/differential/
          retention-days: 90
