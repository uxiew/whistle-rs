[package]
name = "whistle-rs"
version = "0.1.0"
edition = "2024"

# `cargo clippy --all-targets` is expected to be silent, and a regression should
# fail rather than scroll past. This table covers every target in the package
# (lib, bin, tests), which a crate-root `#![deny]` in lib.rs would not — main.rs
# is its own crate. `cargo build` is unaffected: rustc never evaluates these.
[lints.clippy]
all = "deny"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
boa_engine = "0.21.1"
brotli = "8"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "server", "client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "client-legacy", "http1", "http2"] }
once_cell = "1.21.4"
rcgen = { version = "0.13", features = ["x509-parser"] }
regex = "1.12.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webpki-roots = "0.26"
