[package]
name = "whix"
version = "0.1.0"
edition = "2024"
description = "The core of the whistle debugging proxy in Rust: rules, HTTP/HTTPS capture, WebSocket inspection and an embedded web console"
license = "MIT"
repository = "https://github.com/uxiew/whix"
# No `authors`: the field is optional, and there is no list of people who have
# agreed to be named in it. LICENSE says "whix contributors" for the same
# reason.
#
# What a crate package holds, named rather than left to discovery. Without the
# list, `cargo package` took every file git does not ignore — 1,119 of them,
# 940 from a local `_original/` checkout of whistle's own source, plus the
# console's source and the differential corpora — and `cargo publish` would have
# shipped them.
include = [
    "/src/**",
    "/build.rs",
    "/examples/**",
    "/tests/*.rs",
    # What tests/data_compat.rs reads; the tests above would fail without it.
    "/tests/data/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/NOTICE.md",
    "/README.md",
]
# The oldest Rust that builds and passes the tests, found by trying: 1.94
# rejects the `if let` match guards in src/proxy/apply.rs (stable from 1.95),
# and the locked dependencies need 1.88 (boa, time). An older rustc now stops
# at once with "rustc 1.94.0 is not supported by the following packages:
# whix@0.1.0 requires rustc 1.95" instead of a screen of E0658 after
# compiling every dependency. It also makes `cargo update` prefer dependency
# releases that still build on 1.95. Raise it deliberately, never by accident.
rust-version = "1.95"

# `cargo clippy --all-targets` is expected to be silent, and a regression should
# fail rather than scroll past. This table covers every target in the package
# (lib, bin, tests), which a crate-root `#![deny]` in lib.rs would not — main.rs
# is its own crate. `cargo build` is unaffected: rustc never evaluates these.
[lints.clippy]
all = "deny"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
# `annex-b`: the parts of JavaScript the standard files under "legacy" and every
# browser and Node ship - `substr`, `escape`/`unescape`, `<!--` comments. A script
# copied from a whistle setup uses them without a second thought, and without
# the feature `'abc'.substr(1)` is a TypeError here. It adds no crate.
boa_engine = { version = "0.21.1", features = ["annex-b"] }
brotli = "8"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
# The response charset round-trip: whistle runs its text transforms inside an
# `iconv` decode/encode pair keyed on `charset=` (`getPipeIconvStream`,
# `_original/lib/util/index.js:1622-1664`). Without one, `resReplace://` on a
# `charset=gbk` page found nothing and did nothing.
encoding_rs = "0.8"
flate2 = "1"
# Already here under hyper; named directly to tell a stream an HTTP/2 origin
# refused or dropped at GOAWAY — never processed, so safe to send again — from
# one it failed (`upstream::closed_under_us`).
h2 = "0.4.15"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "server", "client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "client-legacy", "http1", "http2"] }
json5 = "1.3.1"
once_cell = "1.21.4"
# `tlsOptions://pfx=client.p12&passphrase=…` — a client certificate as the
# PKCS#12 bundle Windows and the macOS Keychain export. Opening one takes an
# ASN.1 reader, a key derivation and three ciphers (3DES and RC2 for old
# bundles, AES for OpenSSL 3's), which is what this and the ~40 RustCrypto
# crates under it are. rustls reads PEM and nothing else.
p12-keystore = "0.3.2"
rcgen = { version = "0.13", features = ["x509-parser"] }
regex = "1.12.4"
# Already here as boa's regexp engine; named directly so the search box's
# `h:`/`b:` patterns are ECMAScript regexps on this side too (`proxy::search`).
regress = "0.10.5"
# Already here as rustls's crypto; named directly for the one digest a
# WebSocket handshake needs (`Sec-WebSocket-Accept`, SHA-1 by RFC 6455).
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order`: whistle's JSON bodies are JavaScript objects, which keep
# insertion order. Without this `serde_json::Map` is a `BTreeMap` and every body
# it re-serialises comes back alphabetised — `resMerge://{"extra":1}` over
# `{"a":1,"keep":"yes"}` returned `{"a":1,"extra":1,"keep":"yes"}` where whistle
# returns `{"a":1,"keep":"yes","extra":1}`. The bytes a client receives are not
# the place to reorder anything.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webpki-roots = "0.26"

# `tokio::time::pause` — so a test of something that happens on a 22-second
# timer takes microseconds rather than 22 seconds. Test-only on purpose: the
# feature also makes timers advance by themselves, which is not a thing to ship.
[dev-dependencies]
tokio = { version = "1.52.3", features = ["full", "test-util"] }
